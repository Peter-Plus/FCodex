<!doctype html><html lang="zh-CN" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fade Codex · 本地集成测试</title><link id="fade-codex-style" rel="stylesheet" href="theme.css"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.8 "Segoe UI","Microsoft YaHei UI",sans-serif;background:#191919;color:#ededed}#app{display:flex;min-height:100vh}.app-shell-left-panel{width:280px;flex-shrink:0;padding:24px;overflow:auto}button{font:inherit;color:inherit;background:transparent;border:1px solid #8884;border-radius:9px;padding:10px 14px;cursor:pointer}.sidebar-item{display:block;width:100%;text-align:left;margin:5px 0}main{flex:1;padding:55px max(7vw,50px)}article{max-width:760px;margin:10vh auto}h1{font-size:32px;font-weight:500}.composer{margin-top:70px;border:1px solid #8884;border-radius:18px;padding:18px}textarea{font:inherit;border:0;outline:0;background:none;color:inherit;width:100%;resize:none}.project{margin:22px 0}[data-app-action-sidebar-thread-active=true]{color:#c3a4ef}</style><div id="app" data-app-shell-frame data-app-shell-sidebar-open="true"><aside class="app-shell-left-panel"><button id="nativeNew" aria-label="新聊天">新聊天</button><div id="projects" data-slate-sidebar-content></div><button id="profile" aria-label="打开个人资料菜单">预览账户</button></aside><main data-app-shell-main-surface><article><h1 id="title">Fade Codex</h1><p id="body" hidden></p><section data-content-search-unit-key="user" data-local-conversation-user-anchor><div data-user-message-bubble>把导航收起来。<br>保留明暗切换，让内容成为主角。</div></section><section data-content-search-unit-key="assistant" style="margin-top:42px"><p>已更新工作区布局。</p></section><div data-codex-composer-root><div class="composer" data-composer-body data-composer-surface-variant="default"><textarea placeholder="从一个想法开始…" aria-label="本地测试输入框"></textarea><div class="_ComposerLayoutFooter_preview"><div><button id="plus" data-composer-navigation-target="add-context" aria-expanded="false" aria-label="添加文件及更多">＋</button></div><div><button data-composer-navigation-target="reasoning">GPT-6 Astra · 极高</button><span role="img" aria-label="上下文用量：23%">◔</span><button data-composer-navigation-target="permissions">帮我批准</button><button aria-label="听写">♩</button><button aria-label="发送">↑</button></div></div></div></div></article></main></div><script>
const projects=[{id:'A',name:'Fade Codex',chats:['界面与层次','导航与动效','暗亮主题']},{id:'B',name:'Personal site',chats:['首页布局探索','作品集的阅读节奏']},{id:'C',name:'灵感与笔记',chats:['一个新的想法']}];let selected='',count=0;const expanded=new Set();
function render(){const list=document.querySelector('#projects');list.replaceChildren();for(const p of projects){const container=document.createElement('section');container.className='project';container.setAttribute('data-sidebar-project-container-id','project:'+p.id);const button=document.createElement('button');button.className='sidebar-item';for(const [k,v]of Object.entries({'project-row':'','project-id':p.id,'project-label':p.name,'project-collapsed':String(!expanded.has(p.id))}))button.setAttribute('data-app-action-sidebar-'+k,v);button.textContent=p.name;button.onclick=()=>{expanded.has(p.id)?expanded.delete(p.id):expanded.add(p.id);render()};container.append(button);if(expanded.has(p.id))p.chats.forEach((title,i)=>{const b=document.createElement('button'),id=p.id+'-'+i;b.className='sidebar-item';for(const[k,v]of Object.entries({'thread-row':'','thread-id':id,'thread-host-id':'local','thread-kind':'local','thread-title':title,'thread-active':String(selected===id)}))b.setAttribute('data-app-action-sidebar-'+k,v);b.textContent=title;b.onclick=()=>{selected=id;document.querySelector('#title').textContent=title;document.querySelector('#body').textContent=p.name;render()};container.append(b)});list.append(container)}}
document.querySelector('#nativeNew').onclick=()=>{const title='新聊天 '+(++count);projects[0].chats.unshift(title);expanded.add('A');document.querySelector('#title').textContent=title;document.querySelector('textarea').value='';render()};render();document.querySelector('#plus').onclick=()=>{const plus=document.querySelector('#plus'),existing=document.querySelector('[data-composer-overlay-floating-ui]');if(existing){existing.remove();plus.setAttribute('aria-expanded','false');return}const menu=document.createElement('div');menu.setAttribute('data-composer-overlay-floating-ui','');menu.setAttribute('role','menu');menu.style.cssText='position:fixed;bottom:150px;left:15%;z-index:1000;background:var(--fc-panel);color:var(--fc-fg);padding:12px;border:1px solid var(--fc-line);border-radius:14px;min-width:200px';menu.innerHTML='<button role="menuitem">添加文件</button>';document.body.append(menu);plus.setAttribute('aria-expanded','true')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('[data-composer-overlay-floating-ui]')?.remove();document.querySelector('#plus').setAttribute('aria-expanded','false')}});document.querySelector('[data-composer-navigation-target=permissions]').onclick=()=>alert('原生审批选项入口 · 本地测试');document.querySelector('#profile').onclick=()=>alert('原生账户入口 · 本地测试');</script><script src="fade.js"></script></html>
